<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f6f0">
  <meta name="description" content="数字の札を並べて計算式を完成させる、時間制限のない脳トレゲーム。">
  <title>数字ならべ計算パズル</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">自分のペースで楽しむ脳トレ</p>
      <h1>数字ならべ計算パズル</h1>
      <p class="intro">数字の札を空欄に入れて、答えが合う式を作りましょう。</p>
    </header>

    <section id="start-screen" class="panel" aria-labelledby="start-title">
      <h2 id="start-title">難易度を選ぶ</h2>
      <p>好きな難しさから始められます。1回10問、時間制限はありません。</p>
      <div class="level-list">
        <button type="button" data-level="easy"><strong>やさしい</strong><span>札3枚・足し算と引き算</span></button>
        <button type="button" data-level="normal"><strong>ふつう</strong><span>札3枚・掛け算を含む</span></button>
        <button type="button" data-level="hard"><strong>難しい</strong><span>札4枚・括弧も使う</span></button>
      </div>
    </section>

    <section id="game-screen" class="panel" aria-label="計算パズル" hidden>
      <div class="game-top">
        <div><p id="level-name" class="level-name"></p><h2 id="progress"></h2></div>
        <button id="leave-button" class="text-button" type="button">途中で終了</button>
      </div>
      <p class="instruction">数字の札を押して選び、入れたい空欄を押してください。</p>
      <div class="formula-box">
        <p class="small-label">この答えになるように並べましょう</p>
        <div id="formula" class="formula" role="group" aria-label="計算式"></div>
      </div>
      <div class="tray">
        <h3>数字の札</h3>
        <p id="selection-status" class="selection-status" aria-live="polite"></p>
        <div id="tiles" class="tiles" role="group" aria-label="数字の札"></div>
      </div>
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <div class="actions">
        <button id="check-button" class="primary" type="button" disabled>答え合わせ</button>
        <button id="hint-button" type="button">ヒント</button>
        <button id="reset-button" type="button">やり直す</button>
        <button id="answer-button" type="button">答えを見る</button>
      </div>
      <button id="next-button" class="primary next-button" type="button" hidden>次の問題</button>
      <details class="rules"><summary>計算の順番を見る</summary><p>括弧の中を先に計算し、次に掛け算、最後に足し算・引き算を左から計算します。</p></details>
    </section>

    <section id="result-screen" class="panel" aria-labelledby="result-title" hidden>
      <h2 id="result-title">10問終了です</h2>
      <p>おつかれさまでした。自分のペースで考えた結果です。</p>
      <dl class="results">
        <div><dt>自力で解けた問題</dt><dd id="solo-count">0問</dd></div>
        <div><dt>ヒントを使って解けた問題</dt><dd id="hint-count">0問</dd></div>
        <div><dt>答えを見た問題</dt><dd id="answer-count">0問</dd></div>
      </dl>
      <div class="result-actions">
        <button id="again-button" class="primary" type="button">同じ難易度でもう一度</button>
        <button id="choose-button" type="button">難易度を選び直す</button>
      </div>
    </section>
  </main>
</body>
</html>
