<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5f1">
  <meta name="description" content="行・列・色エリアに1羽ずつ、互いに接しないようシマエナガを置くロジックパズル。全10レベル。">
  <title>シマエナガの色わけロジック | Yumin Games</title>
  <link rel="stylesheet" href="./style.css?v=20261010-2">
  <script src="../source-guard.js" defer></script>
  <script src="./script.js?v=20261010-2" defer></script>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="hero-bird" aria-hidden="true"><span class="bird"></span></div>
      <div>
        <p class="eyebrow">SHIMAENAGA COLOR LOGIC</p>
        <h1>シマエナガの<br class="mobile-break">色わけロジック</h1>
        <p class="lead">色の小部屋に、シマエナガを1羽ずつ。</p>
      </div>
    </header>

    <section class="rule-card" aria-labelledby="rules-title">
      <h2 id="rules-title">あそびかた</h2>
      <p>各<strong>行</strong>・各<strong>列</strong>・同じ<strong>色のエリア</strong>に、シマエナガを<strong>1羽ずつ</strong>置きます。</p>
      <p><strong>シマエナガ同士は接しない</strong>ようにします。上下左右も斜めも隣接できません。</p>
      <p class="cycle"><span>空白</span><span aria-hidden="true">→</span><span><span class="tiny-bird" aria-hidden="true">●</span> シマエナガ</span><span aria-hidden="true">→</span><span>×</span><span aria-hidden="true">→</span><span>空白</span></p>
      <p class="rule-note">マスを押すたびに切り替わります。×は「ここには置かない」の目印です。クリア後も修正できます。</p>
    </section>

    <section class="game-card" aria-label="ゲーム">
      <div class="toolbar">
        <label for="level-select">レベル</label>
        <select id="level-select">
          <option value="1">レベル1 · 4×4</option>
          <option value="2">レベル2 · 4×4</option>
          <option value="3">レベル3 · 5×5</option>
          <option value="4">レベル4 · 5×5</option>
          <option value="5">レベル5 · 6×6</option>
          <option value="6">レベル6 · 6×6</option>
          <option value="7">レベル7 · 7×7</option>
          <option value="8">レベル8 · 7×7</option>
          <option value="9">レベル9 · 8×8</option>
          <option value="10">レベル10 · 8×8</option>
        </select>
        <span id="puzzle-number" class="puzzle-number"></span>
      </div>

      <div class="progress-row">
        <p id="count" class="count" aria-live="polite">0 / 4 羽</p>
        <p id="timer" class="timer">00:00</p>
      </div>
      <div id="board" class="board" role="group" aria-label="パズル盤面"></div>
      <p id="status" class="status" role="status" aria-live="polite">行・列・色エリアを見ながら、接しないように置いてみましょう。</p>
      <div id="clear-panel" class="clear-panel" hidden>
        <strong>クリア！ シマエナガがそろいました ✨</strong>
        <span id="clear-time"></span>
        <button id="next-level" type="button">次のレベルへ</button>
      </div>
      <div class="actions">
        <button id="reset" type="button" class="secondary">この問題をリセット</button>
        <button id="new-puzzle" type="button" class="primary">別の問題にする</button>
        <button id="hint" type="button" class="text-button">ヒントを見る</button>
      </div>
      <p id="best" class="best"></p>
    </section>
  </main>
</body>
</html>
