<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#0f172a"><title>テトリス風ゲーム</title><link rel="stylesheet" href="style.css"><script src="../source-guard.js" defer></script></head><body><main class="layout"><header class="game-header"><div><h1>テトリス風ゲーム</h1></div><button id="pause-btn" type="button" disabled>一時停止</button></header><section class="game-area" aria-label="テトリスの盤面"><canvas id="board" width="300" height="600" aria-label="ゲームボード"></canvas><div class="overlay" id="overlay"><h2 id="state-message">準備完了</h2><button id="start-btn" type="button">スタート</button></div></section><aside class="info-panel" aria-label="スコアと次のブロック"><dl class="stats"><div><dt>スコア</dt><dd id="score">0</dd></div><div><dt>ライン</dt><dd id="lines">0</dd></div><div><dt>レベル</dt><dd id="level">1</dd></div></dl><section class="next"><h2>次のブロック</h2><canvas id="next" width="120" height="120" aria-label="次のブロック"></canvas></section><section class="hold"><h2>ホールド</h2><canvas id="hold" width="120" height="120" aria-label="ホールド中のブロック"></canvas></section></aside><section class="touch-controls" aria-label="ゲーム操作ボタン"><button data-action="left" type="button" aria-label="左へ移動"><b>←</b><span>左へ</span></button><button data-action="rotate" type="button" aria-label="右回転"><b>↻</b><span>回転</span></button><button data-action="right" type="button" aria-label="右へ移動"><b>→</b><span>右へ</span></button><button data-action="hold" type="button"><span>ホールド</span><small>入れ替え</small></button><button data-action="down" type="button" aria-label="下へ落とす"><b>↓</b><span>下へ</span></button><button data-action="drop" class="drop-button" type="button"><span>一気に落とす</span><small>すぐに確定</small></button></section><section class="instructions" aria-label="遊び方"><p><strong>スマホ：</strong>画面のボタンで操作。左右・下は長押しできます。回転して、横一列をそろえましょう。</p><p><strong>PC：</strong>← → 移動 ／ ↑ 回転 ／ ↓ 落下 ／ スペース 一気に落とす ／ C ホールド ／ Z 左回転 ／ P 一時停止</p><p>ホールドはブロックを入れ替える機能です。1つのブロックにつき1回使えます。</p></section></main><script src="main.js"></script></body></html>
