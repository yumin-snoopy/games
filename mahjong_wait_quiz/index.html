<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e7">
  <title>麻雀・待ち牌当てクイズ</title>
  <link rel="stylesheet" href="style.css?v=20261020-2">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header><p class="eyebrow">MAHJONG QUIZ</p><h1>待ち牌当てクイズ</h1><p class="lead">13枚の門前手牌です。アガれる牌をすべて選んでください。</p></header>
    <section class="panel settings" aria-label="出題設定"><label for="difficulty">難易度</label><select id="difficulty"><option value="beginner">初級</option><option value="intermediate">中級</option><option value="advanced">上級</option></select><span id="question-number" class="counter"></span></section>
    <section class="panel"><h2>手牌 <small>13枚</small></h2><div id="hand" class="hand" aria-label="手牌"></div></section>
    <section class="panel answer-panel"><h2>待ち牌を選ぶ</h2><p class="guidance">選んだ牌をもう一度押すと取り消せます。該当する牌をすべて選んでください。</p><div id="choices" class="choices"></div><p id="selection-status" class="selection-status" aria-live="polite"></p><div class="actions"><button id="check" class="primary" type="button">答え合わせ</button><button id="hint" type="button">ヒント</button><button id="next" type="button" disabled>次の問題</button></div><p id="hint-text" class="hint-text" aria-live="polite"></p></section>
    <section id="result" class="panel result" hidden aria-live="polite"><h2 id="result-heading"></h2><p class="result-label">正解牌</p><div id="correct-tiles" class="result-tiles"></div><p id="selection-result" class="result-selection"></p><p id="explanation" class="explanation"></p></section>
    <p class="scope">一般形（4面子1雀頭）・七対子・国士無双の和了形で判定します。役・点数・フリテン・場に見えている牌は判定対象外です。</p>
  </main>
</body>
</html>
