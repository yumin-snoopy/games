<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fa"><meta name="description" content="同じ数字を交差しない線でつなぐ、3ステージの数字つなぎパズル。"><title>数字つなぎパズル | Number Link Puzzle</title><link rel="stylesheet" href="./style.css"><script src="./script.js" defer></script><script src="../source-guard.js" defer></script></head><body><main class="app"><header class="hero"><p class="eyebrow">NUMBER LINK PUZZLE</p><h1>数字つなぎパズル</h1><p class="lead">同じ数字を、交差しない線でつなごう。</p></header><section class="game" aria-label="数字つなぎパズル"><div class="topbar"><div><span class="small-label">現在のステージ</span><strong id="level-name">LEVEL 1</strong></div><div class="timer"><span class="small-label">経過時間</span><strong id="timer">00:00</strong></div></div><div id="levels" class="levels" aria-label="ステージを選ぶ"></div><p class="instruction">数字からドラッグ・スワイプして、同じ数字まで線を伸ばします。線を消すときは数字をタップ。</p><div class="board-wrap"><div id="board" class="board" aria-label="パズル盤面"></div></div><div class="bottom"><p id="progress" class="progress" aria-live="polite"></p><div class="actions"><button id="hint-button" type="button">ヒント</button><button id="reset-button" type="button" class="quiet">やり直す</button></div></div><p id="message" class="message" role="status" aria-live="polite"></p></section><p class="rules">上下左右につなげます。ほかの数字や線があるマスは通れません。</p></main><div id="clear-overlay" class="overlay" hidden><section class="clear-card" role="dialog" aria-modal="true" aria-labelledby="clear-title"><span class="sparkle" aria-hidden="true">✦</span><h2 id="clear-title">CLEAR！</h2><p id="clear-copy">すべての数字がつながりました。</p><dl><div><dt>クリア時間</dt><dd id="final-time">00:00</dd></div><div><dt>引き直した回数</dt><dd id="final-redraws">0回</dd></div></dl><button id="next-button" type="button">次のステージへ</button></section></div></body></html>
