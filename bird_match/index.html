<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f2">
  <meta name="description" content="鳥を3羽以上そろえて消す、60秒のマッチパズル。クリック・ドラッグ・スワイプで遊べます。">
  <title>Bird Match Puzzle</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game">
    <header class="heading">
      <p class="eyebrow">A LITTLE BIRD GAME</p>
      <h1>Bird Match Puzzle</h1>
      <p class="subtitle">同じ鳥を3羽以上そろえよう！</p>
    </header>

    <section class="play-area" aria-label="ゲーム">
      <div class="dashboard">
        <div class="stat time-stat"><span>TIME</span><strong id="time">60</strong></div>
        <div class="stat"><span>SCORE</span><strong id="score">0</strong></div>
        <div class="stat"><span>COMBO</span><strong id="combo">—</strong></div>
        <button id="new-game" class="new-game" type="button">NEW GAME</button>
      </div>
      <div class="settings">
        <label for="bird-count">鳥の種類</label>
        <select id="bird-count" aria-label="鳥の種類">
          <option value="3">3種類　かんたん</option>
          <option value="4" selected>4種類　ふつう</option>
          <option value="5">5種類　むずかしい</option>
        </select>
      </div>
      <p id="message" class="message" role="status" aria-live="polite">鳥を1羽選んで、隣の鳥をタップしてください。</p>
      <div class="board-frame">
        <div id="board" class="board" role="grid" aria-label="8行8列の鳥パズル"></div>
      </div>
      <p class="help">クリックで2羽を選ぶか、上下左右にドラッグ・スワイプ。3羽以上で消えます。🌈🐦は交換相手と同じ鳥をすべて消します。</p>
    </section>
  </main>
  <div id="result" class="result" hidden>
    <div class="result-card" role="dialog" aria-modal="true" aria-labelledby="result-title">
      <h2 id="result-title">TIME UP！</h2>
      <p>最終スコア <strong id="final-score">0</strong></p>
      <p>最大コンボ数 <strong id="final-combo">0</strong></p>
      <p>消した鳥の合計数 <strong id="final-cleared">0</strong></p>
      <button id="play-again" class="new-game" type="button">もう一度遊ぶ</button>
    </div>
  </div>
</body>
</html>
