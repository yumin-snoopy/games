<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f2">
  <meta name="description" content="鳥を3羽以上そろえて消す、8×8のマッチパズル。クリックやタップで遊べます。">
  <title>Bird Match Puzzle</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game">
    <header class="heading">
      <p class="eyebrow">A LITTLE BIRD GAME</p>
      <h1>Bird Match Puzzle</h1>
      <p class="subtitle">同じ鳥を3羽以上そろえよう！</p>
    </header>

    <section class="play-area" aria-label="ゲーム">
      <div class="dashboard">
        <div class="stat"><span>SCORE</span><strong id="score">0</strong></div>
        <div class="stat"><span>COMBO</span><strong id="combo">—</strong></div>
        <button id="new-game" class="new-game" type="button">NEW GAME</button>
      </div>
      <p id="message" class="message" role="status" aria-live="polite">鳥を1羽選んで、隣の鳥をタップしてください。</p>
      <div class="board-frame">
        <div id="board" class="board" role="grid" aria-label="8行8列の鳥パズル"></div>
      </div>
      <p class="help">鳥を選ぶ → 上下左右の隣の鳥を選ぶ。3羽以上で消えます。</p>
    </section>
  </main>
</body>
</html>
